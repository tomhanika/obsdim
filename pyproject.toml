[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsdim"
version = "0.1.0.dev0"
description = "Concentration-based intrinsic dimension of geometric data sets (observable diameters, Hanika-Schneider-Stumme)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Tom Hanika" },
]
keywords = [
    "intrinsic dimension",
    "concentration of measure",
    "metric measure spaces",
    "observable diameter",
    "curse of dimensionality",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
array-api = ["array-api-compat>=1.4"]
torch = ["torch", "array-api-compat>=1.4"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/tomhanika/obsdim"
Repository = "https://github.com/tomhanika/obsdim"
Issues = "https://github.com/tomhanika/obsdim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/obsdim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
